<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tango Remixer Icon Viewer</title>
<!-- @llselect/core 0.0.8 (MIT), vendored verbatim: static/llselect/{index.umd.js,vanilla.css,LICENSE} -->
<link rel="stylesheet" href="static/llselect/vanilla.css">
<script src="static/llselect/index.umd.js"></script>
<!-- The window frame (desktop, title bar, menu bar, status bar, buttons, tooltip, About) and its script: shared
     with the website's homepage. -->
<link rel="stylesheet" href="static/window.css">
<script src="static/window.js"></script>
<style>
  /* The client area of this window: toolbar, icon list, detail pane. */
  .client { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 440px; min-height: 0; }
  /* The file card the tooltip shows for the detail pane's thumbnails (the tooltip itself is window.css's). */
  .tip-img { flex: none; padding: 8px; background: #fff; border: 1px solid var(--line); }
  .tip-img.on-dark { background: #3c3b37; }   /* panel glyphs are light */
  .tip-img img { display: block; }
  .tip-text { min-width: 0; }
  .tip-text > div { margin-bottom: 2px; overflow-wrap: anywhere; }
  .tip-head { font-weight: 600; }
  .tip-path, .tip-none { color: var(--muted); }
  .tip-path { font-family: monospace; }
  header { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  header .llselect-root { min-width: 11rem; max-width: 22rem; font-size: 13px; }
  .opt { display: inline-flex; align-items: center; gap: 6px; }   /* llselect checkbox icon + text in a row */
  .api-opt { display: block; }   /* fills its row, so the row's tooltip shows wherever it is pointed at */
  .opt > .check, .opt > img { flex: none; }   /* fixed-size parts: never let a long label squeeze them */
  /* The filter rows' check marks (.check, decorative: llselect carries the real state in aria-selected) and the
     View menu's radio marks are drawn by window.css. */
  .theme-opt img.on-dark { box-sizing: border-box; padding: 2px; border-radius: 3px; background: #3c3b37; }   /* panel glyphs are light */
  .theme-opt small { display: block; color: var(--muted); }
  /* One control look for llselect, buttons and the search box: same border, radius, padding, focus ring. */
  .llselect-root { color: var(--fg); }
  /* Dropdown arrow in the text colour (the vanilla theme pins it to #666, which disappears on the dark
     background); the triangle itself (.arrow) is window.css's. */
  .llselect-trigger-arrow { color: var(--fg); }
  .llselect-trigger, .llselect-popup { background: var(--ctl-bg); color: var(--fg); border-color: var(--ctl-border); }
  .llselect-item:hover, .llselect-item-focused { background: var(--ctl-hover); color: var(--fg); }
  .llselect-item[aria-selected='true'] { background: var(--sel); color: var(--fg); }
  .llselect-choose-all-row, .llselect-group-label { background: var(--hover); color: var(--muted); }
  input[type=search]::placeholder { color: var(--muted); }
  input[type=checkbox] { accent-color: var(--accent); }
  #detail button { padding: 0.2rem 0.5rem; margin: 0 6px 4px 0; }   /* many of them per icon: compact */
  header .entry { flex: 1; max-width: 320px; }   /* the search box, with its clear button (window.css) */
  header > label { white-space: nowrap; }
  #list { overflow-y: auto; }
  /* Grid view: one cell per icon, drawn at the Show-at size with the file the chosen API would pick (pickFile).
     A pick smaller than the cell sits centred in it, the way Qt draws a PNG it will not enlarge. */
  #list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 120px), 1fr)); gap: 4px; padding: 8px; align-content: start; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; padding: 8px 4px; border-radius: 3px; text-align: center; }
  .cell:hover { background: var(--hover); }
  .cell.selected { background: var(--sel); }
  .cell-img { display: flex; align-items: center; justify-content: center; }
  .cell-name, .cell-info { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-info { font-size: 11px; color: var(--muted); }
  .cell-info .fallback { color: var(--fallback); }   /* the folder a fallback comes from */
  /* View controls, at the right end of the status bar: List | Grid (two joined buttons, the current one
     pressed) and, for the grid, a zoom stepper through the sizes the themes have plus the API chooser. */
  .view-controls { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .view-switch { display: inline-flex; white-space: nowrap; }
  .view-switch button:first-child { border-radius: 3px 0 0 3px; }
  .view-switch button:last-child { border-radius: 0 3px 3px 0; margin-left: -1px; }
  button.pressed, button.pressed:hover:not(:disabled) { background: var(--sel); }
  #grid-opts { display: none; align-items: center; gap: 8px; }
  body.grid #grid-opts { display: flex; }
  .zoom { display: inline-flex; align-items: center; gap: 2px; }
  .zoom button img { display: block; margin: 0; }
  /* The controls keep their normal height and the bar grows to fit them, as a GtkStatusbar (a GtkHBox) does. */
  .statusbar .llselect-root { max-width: none; font-size: 13px; }
  #show-at { min-width: 0; }   /* llselect's host element; "24 px" needs no 14rem */
  #status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A row is a wrapping flex line, which decides where the sizes go: beside the name block when the ticked sizes fit
     there in one line, else on a line of their own under it, wrapping further only if even that is too narrow. No
     script and no fixed breakpoint: the ticked sizes vary. Every row has the same figure widths (an empty box where an
     icon lacks a size), so all rows decide alike and the columns keep lining up; the license column is a fixed width
     for the same reason. */
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 4px 12px; border-bottom: 1px solid var(--line); }
  .row:hover { background: var(--hover); }
  .row.selected { background: var(--sel); }
  .meta { width: 252px; flex: none; }
  .meta > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .where, .meta .aliases { color: var(--muted); font-size: 12px; }
  .sizes { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 12px; }
  .row .license { margin-left: auto; flex: none; width: 200px; text-align: right; color: var(--muted); font-size: 12px; }
  .sizes figure { margin: 0; text-align: center; }
  .sizes figcaption { font-size: 10px; color: var(--muted); }
  .sizes .empty { box-sizing: border-box; border: 1px dashed var(--line); }
  /* Detail pane: everything above stays put, the per-size list takes the rest of the height and scrolls on its
     own. If the window is too short for that (list below its min-height), the pane itself scrolls instead. */
  #detail { border-left: 1px solid var(--line); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; }
  #detail > * { flex: none; }
  #detail > .files { flex: 1 1 0; min-height: 170px; overflow-y: auto; }
  .aliases-note { max-height: 4.4em; overflow-y: auto; }   /* some icons have dozens of aliases */
  #detail h3 { margin: 0; }
  .file { padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
  .file:hover { background: var(--hover); }
  .file.selected { background: var(--sel); }   /* the file whose window was opened last */
  /* Rows one clicks (the list's, the grid's cells, the detail pane's files, the sidebar's filter rows): a pointer,
     and no text selection, as a GTK tree view has none, so a drag across them selects nothing. */
  .row, .cell, .file, .exp-row { cursor: pointer; user-select: none; }
  .file .thumb { flex: none; width: 64px; display: flex; justify-content: center; }   /* same sizes as the list rows */
  .file code { display: block; word-break: break-all; color: var(--muted); font-size: 12px; margin: 2px 0 4px; }
  .file .spdx { margin-left: 8px; font-size: 12px; }   /* the file's own SPDX-License-Identifier (fileLicense) */
  .file .spdx.none { color: var(--muted); }            /* none in the file: the theme's license applies */
  .note { margin-top: 6px; color: var(--muted); word-break: break-word; }
  .included { margin-top: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 4px; }
  .included code { display: block; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0; font-size: 12px; }   /* long lines wrap: the size matrix at the end stays visible */
  .included label { margin-right: 10px; white-space: nowrap; }
  /* Expanded filter lists: hidden in the top bar, shown when the header is a sidebar (wide windows). */
  .expanded { display: none; }
  .exp-title { font-weight: 600; margin: 8px 0 4px; }
  .exp-group { margin: 6px 0 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .exp-row { padding: 3px 4px; border-radius: 3px; }
  .exp-row:hover { background: var(--hover); }
  @media (min-width: 1600px) {
    .client { grid-template-rows: 1fr; grid-template-columns: 330px 1fr 440px; }
    #list { grid-column: 2; grid-row: 1; }
    #detail { grid-column: 3; grid-row: 1; }
    /* Sidebar: search, Reset and Dark stay put; below them the height is split in two halves,
       Themes on top, Contexts and Sizes side by side underneath, each half scrolling on its own. */
    header { grid-column: 1; grid-row: 1; display: grid; grid-template-columns: 1fr 1fr; align-items: start;
             padding: 10px; gap: 10px;   /* one spacing everywhere: window edge to block, block to block, both directions */
             grid-template-rows: auto auto minmax(0, 1fr) minmax(0, 1fr); overflow: hidden;
             border-bottom: none; border-right: 1px solid var(--line); }
    header .entry { grid-area: 1 / 1 / 2 / 3; max-width: none; width: calc(100% - 45px); }   /* the row, but for the regexp toggle */
    #re-toggle { grid-area: 1 / 1 / 2 / 3; justify-self: end; align-self: center; }   /* beside the search box, at the row's end */
    /* Reset and the Dark toggle share one full-width row, pushed to opposite ends: half a column is too
       narrow for the toggle's icon and text. */
    #reset { grid-area: 2 / 1 / 3 / 3; justify-self: start; }
    #dark-toggle { grid-area: 2 / 1 / 3 / 3; justify-self: end; align-self: center; }
    #theme-box { grid-area: 3 / 1 / 4 / 3; }
    #context-box { grid-area: 4 / 1; }
    #size-box { grid-area: 4 / 2; }
    #theme-box, #context-box, #size-box { align-self: stretch; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); padding: 6px; }
    header .llselect-root { display: none; }
    .expanded { display: block; }
    /* The title spans the whole box (negative margins undo the box padding) and stays put while the rows scroll. */
    .exp-title { position: sticky; top: -6px; margin: -6px -6px 4px; padding: 6px; background: var(--bg); }
  }
  button img { vertical-align: -3px; margin-right: 4px; }
  #q.invalid { border-color: #c01c28; box-shadow: 0 0 0 2px rgba(192, 28, 40, .25); }
  #re-toggle code { font-size: 12px; }
  /* A phone (700 px and under): the window is maximized (see the script) and the toolbar is two rows: the
     search box with Reset and the Dark toggle (icons only, the toggle drawn as a button, pressed while on),
     then the three filters in thirds, their triggers saying how many are ticked instead of which (see
     multiSelect). The status bar wraps; the detail pane is a window of its own (placeDetail): there is no room for
     it beside the list. (The license column went at 1366 px; where a row's sizes go is flex wrap's call, see .row.) */
  /* A laptop (1366 px and under): the detail pane gives up 80 px and the list its license column (the theme's
     license is in the detail pane and under Help > Icon Themes), so a row with the default sizes fits beside the
     pane down to about 1000 px. */
  @media (max-width: 1366px) {
    .client { grid-template-columns: 1fr 360px; }
    .meta { width: 220px; }
    .row .license { display: none; }
  }
  /* Smaller (900 px and under): the pane gives up 40 px more, and the API chooser, naming just the toolkit (see
     apiSel), shrinks to it. */
  @media (max-width: 900px) {
    .client { grid-template-columns: 1fr 320px; }
    #pick-as { min-width: 0; }
  }
  @media (max-width: 700px) {
    header { gap: 6px; padding: 6px 8px; }
    /* The search box claims the first row but 160 px (room for the three buttons beside it, with some to
       spare), so the filters, sorted after them, wrap to a second row; a quarter each, three of them fit. */
    header .entry { flex: 1 1 calc(100% - 160px); max-width: none; }
    #theme-box, #context-box, #size-box { order: 1; flex: 1 1 25%; min-width: 0; }
    header .llselect-root { display: block; min-width: 0; max-width: none; font-size: 12px; }   /* fills its third */
    header .llselect-trigger { padding-left: 6px; padding-right: 6px; gap: 4px; }   /* less chrome: a third is 110 to 125 px */
    header .llselect-trigger-arrow { padding-left: 6px; margin-left: 0; }
    #reset span, #dark-toggle span, #dark { display: none; }
    #reset img { margin-right: 0; }
    #dark-toggle { padding: 0.4rem 0.6rem; border: 1px solid var(--ctl-border); border-radius: 4px; background: var(--cl-btn, var(--ctl-bg));
                   box-shadow: var(--cl-btn-shadow, none); cursor: pointer; }
    body.dark #dark-toggle { background: var(--cl-btn-active, var(--sel)); box-shadow: inset 2px 2px 3px rgba(0, 0, 0, 0.17); }
    .client { grid-template-columns: 1fr; }
    .client > #detail { display: none; }   /* until placeDetail has moved it into its window */
    .row { padding: 6px 10px; }
    /* Status bar: one row where it fits; else List | Grid (with the grip) wraps to a second row, still at the
       right end (display: contents makes the four parts siblings, so they wrap one by one). */
    .statusbar { flex-wrap: wrap; }
    .view-controls { display: contents; }
    .view-switch { margin-left: auto; }
  }
  /* The detail window (a phone, see placeDetail): the pane fills it under a title bar naming the icon (so the
     pane's own heading is dropped), its file list scrolling as it does beside the list, with a Close button at
     the bottom as About has; the title bar and the button row keep their height. */
  #detail-window[open] { display: flex; flex-direction: column; width: calc(100% - 16px); max-width: none; }
  #detail-window > .titlebar, #detail-window > .buttons { flex: none; }
  #detail-window #detail { flex: 1 1 auto; min-height: 0; border-left: 0; }
  #detail-window #detail > .files { flex-basis: auto; }   /* sized by its files, so the window grows to fit them, up to the screen (beside the list the pane is as tall as the window anyway) */
  #detail-window #detail h3 { display: none; }
  #detail-window .buttons { text-align: right; padding: 8px 12px; border-top: 1px solid var(--line); }
  /* There a file's window (openFileWindow) is the way to its details: no pointer to hover the card with. */
  #detail-window .files::before { content: "Tap a file for its details."; display: block; padding: 6px 0 2px; font-size: 12px; color: var(--muted); }
  /* Tool windows (Help > Icon Themes, a file's properties): a title bar, a body that scrolls when the window would
     outgrow the screen, a Close button; laid out like the detail window on a phone. */
  .tool-window[open] { display: flex; flex-direction: column; box-sizing: border-box; width: 600px; max-width: calc(100% - 16px); max-height: calc(100% - 16px); }
  /* The file's window is as wide as its preview row: the eight sizes (590 px) in their cards (18 px of padding and
     border each) with 10 px between, plus the body's and the frame's padding; narrower screens wrap the row. */
  #file-window[open] { width: calc(590px + 8 * 18px + 7 * 10px + 24px + 10px); }
  .tool-window > .titlebar, .tool-window > .buttons { flex: none; }
  .tool-window .buttons { text-align: right; padding: 8px 12px; border-top: 1px solid var(--line); }
  .tool-window .body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 12px 8px; }
  /* Help > Icon Themes: every source theme as the Themes filter lists them, plus what the filter has no room for
     (how many icons and files, where the files are). */
  .themes .group { margin: 10px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .themes .theme { display: grid; grid-template-columns: 32px 1fr; column-gap: 10px; align-items: start; padding: 6px 0; border-top: 1px solid var(--line); }
  .themes .theme.derived { margin-left: 42px; border-top-style: dashed; }   /* a Blue* variant, under the theme whose files it colorizes */
  .themes .theme > img { grid-row: 1 / 4; display: block; box-sizing: border-box; }
  .themes .theme > img.on-dark { padding: 3px; border-radius: 3px; background: #3c3b37; }   /* panel glyphs are light */
  .themes .name { font-weight: 600; }
  .themes .name small { font-weight: normal; color: var(--muted); }
  .themes .blurb, .themes .source { font-size: 12px; color: var(--muted); }
  .themes .source a { margin-right: 10px; }
  .themes .source code { overflow-wrap: anywhere; }
  .themes .more { margin-top: 12px; font-size: 12px; color: var(--muted); }
  /* A file's properties (a click on a size in the detail pane, its picture or its size line): the picture, then
     label / value rows under group titles, as GNOME 2's Properties dialogs had them. */
  .file-props .head { display: flex; gap: 14px; align-items: center; margin: 8px 0 4px; }
  .file-props h4 { margin: 12px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
  .file-props dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; font-size: 12px; }
  .file-props dt { color: var(--muted); text-align: right; white-space: nowrap; }
  .file-props dd { margin: 0; overflow-wrap: anywhere; }
  .file-props .previews { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin: 6px 0 2px; }   /* the one file at every size */
  .file-props figure { margin: 0; text-align: center; font-size: 11px; color: var(--muted); }
  .file-props figure .tip-img { display: inline-block; }
  .file-props figure.own figcaption { color: var(--fg); font-weight: 600; }   /* the size the file is for */
</style>
<!-- GNOME 2 Clearlooks repaint; delete this line for the plain look -->
<link rel="stylesheet" href="static/clearlooks.css">
<!-- GNOME 2's mouse cursors (DMZ-White, static/cursors/); delete this line for the browser's -->
<link rel="stylesheet" href="static/cursors/cursors.css">
</head>
<body>
<div class="window">
<div class="titlebar">
  <img class="wm-icon" src="icons/Nome/apps/16/preferences-desktop-theme.svg" width="16" height="16" alt="">
  <span class="wm-title">Tango Remixer Icon Viewer</span>
  <span class="wm-buttons">
    <button type="button" class="wm-button" id="wm-minimize" title="Minimize (a browser tab has nothing to minimize)"><svg viewBox="0 0 9 9"><rect class="o" x="0.5" y="5.5" width="8" height="3"/><rect class="i filled" x="1" y="6" width="7" height="2"/></svg></button>
    <button type="button" class="wm-button" id="wm-maximize" title="Maximize"><svg viewBox="0 0 9 9"><g class="maximize"><rect class="o" x="0.5" y="0.5" width="8" height="8"/><rect class="o" x="2.5" y="3.5" width="4" height="3"/><rect class="i" x="1.5" y="1.5" width="6" height="6"/><path class="i" d="M2 2.5h5"/></g><g class="restore"><rect class="o" x="1.5" y="1.5" width="6" height="6"/><rect class="o" x="3.5" y="4.5" width="2" height="2"/><rect class="i" x="2.5" y="2.5" width="4" height="4"/><path class="i" d="M3 3.5h3"/></g></svg></button>
    <button type="button" class="wm-button" id="wm-close" title="Close (only drawn: the tab stays open)"><svg viewBox="0 0 9 9"><path class="o" stroke-width="4" d="M1.5 1.5l6 6M7.5 1.5l-6 6"/><path class="i" stroke-width="2" d="M1.5 1.5l6 6M7.5 1.5l-6 6"/></svg></button>
  </span>
</div>
<nav class="menubar" id="menubar"></nav>
<div class="client">
<header>
  <span class="entry"><input type="search" id="q" placeholder="Search icon name…" autofocus><button type="button" class="clear" id="q-clear" title="Clear the search box (Esc)"><img src="icons/Tango/16x16/actions/edit-clear.svg" width="16" height="16" alt=""></button></span>
  <label id="re-toggle" title="Read the search box as a regular expression, case-insensitive. Example: ^(system-run|security-)"><input type="checkbox" id="re"> <code>.*</code></label>
  <div id="theme-box"><div id="theme"></div><div class="expanded" id="theme-list"></div></div>
  <div id="context-box"><div id="context"></div><div class="expanded" id="context-list"></div></div>
  <div id="size-box"><div id="size"></div><div class="expanded" id="size-list"></div></div>
  <button id="reset" title="Search, regexp, themes, contexts and sizes back to their defaults"><img src="icons/Tango/16x16/actions/edit-undo.svg" width="16" height="16" alt=""><span> Reset</span></button>
  <label id="dark-toggle" title="Draw the icons on a dark background"><input type="checkbox" id="dark"> <img src="icons/Tango/16x16/status/weather-clear-night.svg" width="16" height="16" alt="" style="vertical-align:-3px"><span> Dark background</span></label>
</header>
<main id="list"></main>
<aside id="detail"><p style="color:var(--muted)">Click an icon to see its files.</p></aside>
</div>
<div class="statusbar"><span id="status">Loading…</span>
  <div class="view-controls">
    <div id="grid-opts">
      <div class="zoom" title="Size requested from the icon API, e.g. pixmap(24).
Grid icons may come out smaller or larger: see As."><button type="button" id="zoom-out" title="Zoom out: the next smaller size the themes have"><img src="icons/Tango/16x16/actions/zoom-out.svg" width="16" height="16" alt="Zoom out"></button><div id="show-at"></div><button type="button" id="zoom-in" title="Zoom in: the next larger size the themes have"><img src="icons/Tango/16x16/actions/zoom-in.svg" width="16" height="16" alt="Zoom in"></button></div>
      <div id="pick-as-box"><div id="pick-as"></div></div>
    </div>
    <span class="view-switch" title="List: every ticked size side by side. Grid: one size per icon, drawn as the chosen API would draw it."><button type="button" id="view-list">List</button><button type="button" id="view-grid">Grid</button></span>
  </div>
  <span class="grip"></span></div>
</div>
<dialog id="about" aria-labelledby="about-name">
  <div class="titlebar"><span class="wm-title">About Tango Remixer Icon Viewer</span><span class="wm-buttons"><button type="button" class="wm-button" title="Close" onclick="this.closest('dialog').close()"><svg viewBox="0 0 9 9"><path class="o" stroke-width="4" d="M1.5 1.5l6 6M7.5 1.5l-6 6"/><path class="i" stroke-width="2" d="M1.5 1.5l6 6M7.5 1.5l-6 6"/></svg></button></span></div>
  <div class="about">
    <img src="icons/Nome/apps/48/preferences-desktop-theme.svg" width="48" height="48" alt="">
    <h2 id="about-name">Tango Remixer Icon Viewer</h2>
    <p>Browse the source icon themes and copy lines for <code>included_icons.txt</code>.</p>
    <a href="https://github.com/kuanyui/tango-remixer" target="_blank" rel="noopener">github.com/kuanyui/tango-remixer</a>
    <div class="buttons"><button type="button" onclick="this.closest('dialog').close()">Close</button></div>
  </div>
</dialog>
<dialog id="themes" class="tool-window" aria-labelledby="themes-title">

<script>
const MAX_ROWS = 500;
const token = new URLSearchParams(location.search).get('token');
// Width tiers, matching the media queries at the end of the style sheet: on a laptop (1366 px and under) the
// filter triggers say how many are ticked instead of which, the list drops its license column and the detail pane
// narrows; at 900 px and under the API chooser names just the toolkit; 700 px and under is the phone layout
// (`narrow`). Where a row puts its sizes is not a tier: flex wrap decides by the ticked sizes' width (see .row).
const TIERS = { laptop: '(max-width: 1366px)', small: '(max-width: 900px)', phone: '(max-width: 700px)' };
const tier = name => matchMedia(TIERS[name]).matches;
const narrow = () => tier('phone');
const DEFAULT_SIZES = ['16', '22', '24', '32', '48', 'scalable'];   // scalable: the FLOSS application themes have nothing else
// Grid view: the API whose lookup and drawing the cells imitate. `rules` is the chooser's tooltip.
const APIS = {
  qt6: { label: 'Qt 6 QIcon::fromTheme()', short: 'Qt 6 QIcon::fromTheme', rules: `Qt 6 · QIcon::fromTheme()
1. Exact size folder first.
2. Else nearest in pixels; @2 folders count double.
3. Ties: the folder name sorting last, character by character.
4. PNGs shrink, never enlarge: smaller picks keep their size.` },
  gtk4: { label: 'GTK 4 gtk_icon_theme_lookup_icon()', short: 'GTK 4 gtk_icon_theme_lookup_icon', rules: `GTK 4 · gtk_icon_theme_lookup_icon()
1. Exact pixels first, @2 folders included.
2. Else same-size or larger folders first; then nearest pixels.
3. Ties: the folder whose Scale matches.
4. PNGs scale to the requested size.` },
  gtk3: { label: 'GTK 3 gtk_icon_theme_lookup_icon()', short: 'GTK 3 gtk_icon_theme_lookup_icon', rules: `GTK 3 · gtk_icon_theme_lookup_icon()
1. Exact pixels first, @2 folders included.
2. Else same-size or larger folders first; then nearest pixels.
3. Ties: the folder whose Scale matches.
4. GtkImage keeps the PNG's own size, unless pixel-size is set.` },
  gtk2: { label: 'GTK 2 gtk_icon_theme_lookup_icon()', short: 'GTK 2 gtk_icon_theme_lookup_icon', rules: `GTK 2 · gtk_icon_theme_lookup_icon()
1. Exact size folder first.
2. Else larger folders first; then nearest.
3. @2 folders are ignored: no Scale support.
4. GtkImage keeps the PNG's own size.` },
};
// Filter state lives in localStorage (per origin, so the server's fixed port matters). The dark background is
// window.js's setting, shared with the homepage, painted before the first paint; the check box follows it.
const STORAGE_KEY = 'tango-remixer-icon-viewer';
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState() {
  const state = { q: $('q').value, re: $('re').checked, themes: themeSel.getChosenItems(),
    contexts: contextSel.getChosenItems(), sizes: sizeSel.getChosenItems(),
    view, showAt: showAtSel?.getChosenItem(), api: apiSel?.getChosenItem(),
    maximized, scroll: $('list').scrollTop, selected: selectedKey };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}
setDark(savedDark(!!loadState().dark));   // a build before the setting was shared kept it in the state above: carried over once
$('dark').checked = isDark();
document.addEventListener('darkchange', e => { $('dark').checked = e.detail; });   // the View menu toggles it too
// Button icons come from the themes themselves (Tango where it has a 16 px one, else Nome).
const UI_ICONS = {
  reveal: 'Nome/apps/16/system-file-manager.svg',
  dir: 'Tango/16x16/status/folder-open.svg',
  copy: 'Nome/actions/16/edit-copy.svg',
  copied: 'Nome/emblems/16/emblem-default.svg',
  inkscape: 'InkscapeTango/actions/scalable/inkscape-logo.svg',
  web: 'Nome/apps/16/web-browser.svg',   // the static site's link to the file on GitHub
};
let icons = [], folders = {}, themeInfo = {}, contextIcons = {}, allSizes = [], themeSel, contextSel, sizeSel, showAtSel, apiSel, selectedKey = null;
let view = 'list';   // 'list' | 'grid'
const keyOf = icon => `${icon.theme}/${icon.context}/${icon.name}`;

const buttonContent = (icon, label) => [el('img', { src: `icons/${UI_ICONS[icon]}`, width: 16, height: 16, alt: '' }), label];
function iconButton(icon, label, onclick, title) {
  return el('button', { onclick, title }, ...buttonContent(icon, label));
}

// A line for included_icons.txt, in the column layout the project's own file uses (theme @0, source @18,
// size matrix @64; the parser needs a tab or 4+ spaces between fields). The context is only written when
// the same name exists in another context of that theme. Always the real file name: aliases are not usable there.
function includedLine(icon, matrix) {
  const ambiguous = icons.some(i => i.theme === icon.theme && i.name === icon.name && i.context !== icon.context);
  const src = ambiguous ? `${icon.context}/${icon.name}` : icon.name;
  const pad = (text, width) => text.length + 4 > width ? text + '    ' : text.padEnd(width);
  return pad(icon.theme, 18) + pad(src, 46) + matrix;
}

// The shortest size matrix that selects exactly `checked` out of the icon's `available` sizes (both in size
// order). Checked sizes that are neighbours among the available ones become a range, open-ended where the run
// touches the smallest or largest available size: [16,22,24,32] of [16,22,24,32,48] -> `{-32}`.
// `scalable` has no pixel size of its own, so the parser only accepts it with an output size: one
// `scalable>N` per entry of `scalableTargets`. A range claims every output size inside it (even sizes the
// icon has no file for), which would collide with `scalable>N`, so with targets the files are listed singly.
// Empty string when nothing is selected.
function sizeMatrix(available, checked, scalableTargets) {
  const nums = available.filter(s => s !== 'scalable'), segs = [];
  let run = [];
  const flush = () => {
    if (run.length === 1) segs.push(run[0]);
    else if (run.length) segs.push((run[0] === nums[0] ? '' : run[0]) + '-' + (run[run.length - 1] === nums[nums.length - 1] && run[0] !== nums[0] ? '' : run[run.length - 1]));
    run = [];
  };
  const useRanges = !(checked.includes('scalable') && scalableTargets.length);
  for (const size of nums) { checked.includes(size) ? run.push(size) : flush(); if (!useRanges) flush(); }
  flush();
  if (checked.includes('scalable')) segs.push(...scalableTargets.map(t => `scalable>${t}`));
  return segs.length ? `{${segs.join(';')}}` : '';
}

// A multi-select whose trigger reads e.g. `Sizes: 16, 22, 24` (or `all` / `none`), chosen ones in item order; on a
// laptop and under `Sizes: 3` (or `all`): three of them share a phone's row.
// Rows carry a CSS-drawn check mark (`.check`); they re-render on every chosen-state change, so it stays in sync.
// opts.groupOf(item) puts items under option-group headers; opts.itemContent(item, checkbox) renders a richer row;
// opts.title is the tooltip of the trigger and of the sidebar heading.
function multiSelect(id, label, items, chosen, opts = {}) {
  const STATES = { none: 'unchecked', some: 'indeterminate', all: 'checked' };   // llselect's choose-all vocabulary
  const checkbox = state => { const c = el('span', { className: 'check' }); c.dataset.state = STATES[state] || state; return c; };
  const content = item => {
    const box = checkbox(sel.isChosen(item) ? 'checked' : 'unchecked');
    return opts.itemContent ? opts.itemContent(item, box) : el('span', { className: 'opt' }, box, item);
  };
  const sel = new llselect.LLSelectMultiple($(id), {
    ariaLabel: label,
    chooseAllRow: true,
    itemToGroupKeyFn: opts.groupOf || null,
    createTriggerArrowContentElFn: () => el('span', { className: 'arrow' }),   // drawn by CSS, follows the theme colours
    createItemContentElFn: item => content(item),
    createChooseAllRowContentElFn: (state, chosenCount, totalCount) => el('span', { className: 'opt' },
      checkbox(state), `All (${chosenCount}/${totalCount})`),
    createTriggerContentElFn: ({ chosenItems, items }) => el('span', {}, `${label}: ` +
      (chosenItems.length === items.length ? 'all' : tier('laptop') ? chosenItems.length : !chosenItems.length ? 'none'
        : items.filter(i => chosenItems.includes(i)).join(', '))),
    onChange: () => render(),
  });
  sel.setItems(items);
  sel.setChosenItems(chosen);
  if (opts.title) $(id).querySelector('.llselect-trigger').title = opts.title;
  // The same rows, always visible, for the wide-window sidebar (llselect itself is popup-only). Rows are built
  // once; a refresh only swaps the checkbox icons, so the row images are not fetched again.
  const allRow = el('div', { className: 'exp-row', onclick: () => sel.toggleAll() });
  const rows = items.map(item => el('div', { className: 'exp-row', onclick: () => sel.toggleItem(item) }, content(item)));
  const heading = el('div', { className: 'exp-title' }, label);
  if (opts.title) heading.title = opts.title;
  const children = [heading, allRow];
  items.forEach((item, k) => {
    if (opts.groupOf && (k === 0 || opts.groupOf(item) !== opts.groupOf(items[k - 1]))) children.push(el('div', { className: 'exp-group' }, opts.groupOf(item)));
    children.push(rows[k]);
  });
  $(id + '-list').replaceChildren(...children);
  sel.refreshExpanded = () => {
    const n = sel.getChosenItems().length;
    allRow.replaceChildren(el('span', { className: 'opt' }, checkbox(n === 0 ? 'none' : n === items.length ? 'all' : 'some'), `All (${n}/${items.length})`));
    items.forEach((item, k) => { rows[k].querySelector('.check').dataset.state = sel.isChosen(item) ? 'checked' : 'unchecked'; });
  };
  return sel;
}
// `scalable` folders have no pixel size: show them at 48. Rows cap at 64 so a 256 icon stays a thumbnail.
const rowPx = size => Math.min(size === 'scalable' ? 48 : Number(size), 64);
function img(icon, s, px) {
  return el('img', { src: encodeURI(`icons/${icon.theme}/${s.path}`), width: px, height: px, loading: 'lazy', title: `${icon.name} ${s.size}` });
}

// The status text: how many icons the filter matches and, past the cap, that the list stops there (the cap is
// explained in the tooltip; on a phone just `500 / 3095`, the status bar keeping to one row where it can).
let hitCount = 0;
function showStatus() {
  const capped = hitCount > MAX_ROWS;
  $('status').textContent = !capped ? `${hitCount} icons` : narrow() ? `${MAX_ROWS} / ${hitCount}` : `Showing ${MAX_ROWS} of ${hitCount} icons`;
  $('status').title = capped ? `Your filters match ${hitCount} icons, but the list shows only the first ${MAX_ROWS}. To find other icons, type part of a name in the search box or untick some Themes, Contexts or Sizes filters.` : '';
}
function render() {
  if (!sizeSel) return;   // selects not built yet
  const typed = $('q').value.trim();
  // The box is a plain substring unless `.*` is ticked, and then a regular
  // expression. A half-typed pattern is a normal thing to see while typing, so
  // it only marks the box and says why - the list stays as it was rather than
  // emptying itself under the cursor.
  let matches;
  if ($('re').checked && typed) {
    try {
      const pattern = new RegExp(typed, 'i');
      matches = i => pattern.test(i.name) || i.aliases.some(a => pattern.test(a));
    } catch (error) {
      $('q').classList.add('invalid');
      $('status').textContent = `Invalid regexp: ${error.message}`;
      saveState();                       // what was typed is still worth keeping
      return;
    }
  } else {
    const q = typed.toLowerCase();
    matches = i => i.name.includes(q) || i.aliases.some(a => a.includes(q));
  }
  $('q').classList.remove('invalid');
  const themes = new Set(themeSel.getChosenItems()), contexts = new Set(contextSel.getChosenItems());
  const sizes = allSizes.filter(s => sizeSel.isChosen(s));   // the columns, in canonical order
  const hits = icons.filter(i => themes.has(i.theme) && contexts.has(i.context)
    && i.sizes.some(s => sizes.includes(s.size)) && matches(i));
  const grid = view === 'grid', showAt = grid ? Number(showAtSel.getChosenItem()) : 0, api = grid ? apiSel.getChosenItem() : '';
  $('list').classList.toggle('grid', grid);
  if (grid) {
    $('list').style.setProperty('--cell', `${Math.max(showAt, 64) + 40}px`);
    const steps = showAtSel.getItems(), k = steps.indexOf(String(showAt));
    $('zoom-out').disabled = k <= 0;
    $('zoom-in').disabled = k >= steps.length - 1;
  }
  $('list').replaceChildren(...hits.slice(0, MAX_ROWS).map(icon => grid ? gridCell(icon, showAt, api) : listRow(icon, sizes)));
  [...$('list').children].find(n => n.dataset.key === selectedKey)?.classList.add('selected');   // keep the highlight across re-renders
  hitCount = hits.length;
  showStatus();
  for (const sel of [themeSel, contextSel, sizeSel]) sel.refreshExpanded();
  saveState();
}

// A list row: name block, one column per chosen size (an empty box where the icon lacks that size, so columns
// line up), the theme's license. data-key lets a restored selection find its row again.
function listRow(icon, sizes) {
  const row = el('div', { className: 'row', onclick: () => showDetail(icon, row, true) },
    el('div', { className: 'meta', title: icon.aliases.join('\n') },
      el('div', { className: 'where' }, `${icon.theme}/${icon.context}`),
      el('div', {}, icon.name),
      el('div', { className: 'aliases' }, icon.aliases.join(', ') || '\u00a0')),   // keep 3 lines so rows line up
    el('div', { className: 'sizes' }, ...sizes.map(size => {
      const s = icon.sizes.find(x => x.size === size), px = rowPx(size);
      return el('figure', {}, s ? img(icon, s, px) : el('div', { className: 'empty', style: `width:${px}px;height:${px}px` }),
        el('figcaption', {}, size));
    })),
    el('div', { className: 'license' }, themeInfo[icon.theme].license));
  row.dataset.key = keyOf(icon);
  return row;
}

// --- Grid view: what an icon-theme API would show ---------------------------------------------------------
// The build writes a PNG theme with one Type=Fixed folder per size plus a @2 twin (Scale=2, twice the pixels),
// listed in index.theme by size ascending. The ticked Sizes are the sizes that would be included; `scalable`
// counts as the exact file for any size (what a `scalable>N` line gives). For a requested size the APIs pick:
//   Qt 6 (qiconloader.cpp, QIconLoaderEngine::entryForSize): the exact folder, else the nearest in pixels with
//     @2 counting double; a tie goes to the folder name that sorts last alphabetically (QSettings sorts the
//     sections, PNG entries are prepended). PixmapEntry only ever shrinks a PNG.
//   GTK 3 / 4 (gtkicontheme.c, compare_dir_matches): a folder at pixel distance 0 (a @2 twin counts), else a
//     folder whose Size is >= the request always beats a smaller one, then the nearest in pixels, then the folder
//     whose Scale matches. GTK 4 draws the PNG scaled to the request; GTK 3's GtkImage draws it at its own size
//     unless pixel-size is set (GTK_ICON_LOOKUP_FORCE_SIZE).
//   GTK 2 (theme_lookup_icon): the exact folder, else a larger folder always beats a smaller one, then the
//     nearest; no Scale= support, so the @2 twins never win; GtkImage draws the PNG at its own size.
// Returns { file, folder, px, shown, exact, tie } (+ nominal, scale for a fallback).
function pickFile(icon, size, api) {
  const files = icon.sizes.filter(s => sizeSel.isChosen(s.size)), have = files.map(s => s.size);   // never empty: the filter kept this icon
  const exact = files.find(s => s.size === String(size)) || files.find(s => s.size === 'scalable');
  if (exact) return { file: exact, folder: exact.size === 'scalable' ? 'scalable' : `${size}x${size}`, px: size, shown: size, exact: true, tie: null, have };
  const scales = api === 'gtk2' ? [1] : [1, 2];
  const dirs = files.filter(s => s.size !== 'scalable').flatMap(s => scales.map(scale =>
    ({ file: s, folder: `${s.size}x${s.size}${scale === 2 ? '@2' : ''}`, nominal: Number(s.size), scale, px: Number(s.size) * scale })));
  const dist = d => Math.abs(d.px - size);
  // `primary` decides nearly every case; `final` is the API's tie rule. A tie is reported when only `final` decided.
  const primary = api === 'qt6' ? d => [dist(d)]
    : api === 'gtk2' ? d => [d.nominal > size ? 0 : 1, dist(d)]
    : d => [dist(d) === 0 ? 0 : 1, d.nominal >= size ? 0 : 1, dist(d)];
  const final = api === 'qt6' ? (a, b) => (a.folder < b.folder) - (a.folder > b.folder)
    : api === 'gtk2' ? (a, b) => a.nominal - b.nominal
    : (a, b) => (a.scale !== 1) - (b.scale !== 1) || b.nominal - a.nominal || b.scale - a.scale;
  const same = (a, b) => primary(a).every((v, k) => v === primary(b)[k]);
  dirs.sort((a, b) => { const pa = primary(a), pb = primary(b), k = pa.findIndex((v, i) => v !== pb[i]); return k < 0 ? final(a, b) : pa[k] - pb[k]; });
  const [pick, next] = dirs;
  const shown = api === 'qt6' ? Math.min(pick.px, size) : api === 'gtk4' ? size : pick.px;
  return { ...pick, shown, exact: false, tie: next && same(pick, next) ? next : null, have };
}
// Three lines: name · theme · request; the ticked sizes the icon has; what was drawn and the one rule that decided.
function cellTitle(icon, pick, size, api) {
  const drawn = `${pick.folder} drawn at ${pick.shown} px`;
  let why;
  if (pick.exact) why = pick.file.size === 'scalable' ? `as scalable>${size} gives` : 'exact match';
  else if (pick.px === size) why = 'exact in pixels';
  else if (api === 'qt6') why = pick.px > size ? 'nearest, shrunk' : 'nearest; a smaller PNG keeps its size';
  else {
    const larger = pick.nominal > size;
    const keep = api === 'gtk4' ? '' : '; GtkImage keeps the PNG size';
    why = (larger ? 'larger folders first, nearest of them' : 'no larger folder; nearest in pixels') + keep;
  }
  if (pick.tie) why += api === 'qt6' ? `; tie with ${pick.tie.folder}, ${pick.folder} sorts last` : `; tie with ${pick.tie.folder}, Scale matches`;
  return [`${icon.name} · ${icon.theme} · asked for ${size} px`, `Ticked sizes present: ${pick.have.join(', ')}`, `${drawn}: ${why}.`].join('\n');
}
function gridCell(icon, size, api) {
  const pick = pickFile(icon, size, api), box = Math.max(size, pick.shown);   // GTK 2 / 3 may draw a bigger file as is
  const cell = el('div', { className: 'cell', title: cellTitle(icon, pick, size, api), onclick: () => showDetail(icon, cell, true) },
    el('div', { className: 'cell-img', style: `width:${box}px;height:${box}px` },
      el('img', { src: encodeURI(`icons/${icon.theme}/${pick.file.path}`), width: pick.shown, height: pick.shown, loading: 'lazy', alt: '' })),
    el('div', { className: 'cell-name' }, icon.name),
    el('div', { className: 'cell-info' }, icon.theme, ...(pick.exact ? [] : [' · ', el('span', { className: 'fallback' }, pick.folder)])));
  cell.dataset.key = keyOf(icon);
  return cell;
}
function setView(mode) {
  view = mode;
  document.body.classList.toggle('grid', mode === 'grid');
  $('view-list').classList.toggle('pressed', mode === 'list');
  $('view-grid').classList.toggle('pressed', mode === 'grid');
  render();
}
$('view-list').addEventListener('click', () => setView('list'));
$('view-grid').addEventListener('click', () => setView('grid'));
// Zoom: step Show-at through the sizes the themes have (the chooser's items).
function zoom(step) {
  const steps = showAtSel.getItems(), next = steps[steps.indexOf(showAtSel.getChosenItem()) + step];
  if (next) showAtSel.setChosenItem(next);   // renders
}
$('zoom-out').addEventListener('click', () => zoom(-1));
$('zoom-in').addEventListener('click', () => zoom(1));

// The included_icons.txt box: size checkboxes (start from the Sizes filter), the resulting line, Copy line.
// An icon with a `scalable` file gets a second row: the pixel sizes to produce from it, by default the
// filter's sizes that the icon does not have as a file of its own.
const SCALABLE_TARGETS = ['16', '22', '24', '32', '48', '64', '128', '256'];
function includedBox(icon) {
  const available = icon.sizes.map(s => s.size), chosen = new Set(available.filter(s => sizeSel.isChosen(s)));
  const targets = new Set(SCALABLE_TARGETS.filter(t => sizeSel.isChosen(t) && !available.includes(t)));
  const line = el('code', {});
  const copy = iconButton('copy', 'Copy line', e => copyText(line.textContent, e.currentTarget),
    'Copy this line. Pasted into included_icons.txt it includes exactly the checked sizes of this icon.');
  const copyName = iconButton('copy', 'Copy icon name', e => copyText(icon.name, e.currentTarget),
    'Copy the name alone: what QIcon::fromTheme() or gtk_icon_theme_lookup_icon() asks for.');
  const check = (set, size, label) => el('label', {}, el('input', { type: 'checkbox', checked: set.has(size), value: size,
    onchange: e => { e.target.checked ? set.add(size) : set.delete(size); refresh(); } }), ' ' + label);
  const targetBoxes = available.includes('scalable') ? SCALABLE_TARGETS.map(t => check(targets, t, t)) : [];
  function refresh() {
    // A size that is checked as a real file is not also produced from `scalable`.
    for (const box of targetBoxes) box.firstChild.disabled = !chosen.has('scalable') || chosen.has(box.firstChild.value);
    const matrix = sizeMatrix(available, available.filter(s => chosen.has(s)), SCALABLE_TARGETS.filter(t => targets.has(t) && !chosen.has(t)));
    // Shown wrapped when long; the break points sit after the `;` of the matrix, not inside a size (wbr adds
    // nothing to the copied text).
    line.replaceChildren(...(matrix ? includedLine(icon, matrix) : 'Check at least one size.').split(/(?<=;)/).flatMap((part, k) => k ? [el('wbr'), part] : [part]));
    copy.disabled = !matrix;
  }
  refresh();
  return [
    el('strong', { title: 'A line for the included_icons.txt that build_icons.py reads: THEME, SOURCE ICON and a size matrix, separated by 4+ spaces or a tab.' }, 'included_icons.txt'),
    el('div', { className: 'note', title: 'Files to include. They start from the Sizes filter above. The matrix is written in its shortest form, e.g. {-32} when every available size up to 32 is checked.' },
      ...available.map(size => check(chosen, size, size))),
    ...(targetBoxes.length ? [el('div', { className: 'note', title: 'Pixel sizes to produce from the scalable file (written as scalable>N). A size already checked above as a real file is skipped.' },
      'scalable → ', ...targetBoxes)] : []),
    line, copy, copyName];
}

// The detail pane's "Theme license" line: whose license that is. It is the theme's own declaration (its COPYING or

// --- A file's details ----------------------------------------------------------------------------------
// The SVG text of a file is read once (fileMeta; the server sends the source file, colorized for Blue*) and
// parsed (parseMeta) for: its SPDX-License-Identifier comment; the RDF block Inkscape writes (cc:Work: title,
// creator, date, keywords, license, ..., field by field in the file's order, and the cc:License terms); the
// drawing's width, height and viewBox; and the document's Inkscape version, name, title and description. The
// detail pane shows a card on hover over a thumbnail (fileCard: the picture at 128 px, the license, the RDF
// fields), the way GNOME 2's image viewer described its thumbnails, and opens the file's own window on a click
// anywhere on the file's row (openFileWindow): every property, as a GNOME 2 Properties dialog lists them.
// On a phone that window opens over the detail window.
const DC = 'http://purl.org/dc/elements/1.1/', RDF = 'http://www.w3.org/1999/02/22-rdf-syntax-ns#';
const CC = ['http://creativecommons.org/ns#', 'http://web.resource.org/cc/'];   // today's and 2005's cc namespace
const INKSCAPE = 'http://www.inkscape.org/namespaces/inkscape', SODIPODI = 'http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd';
const RDF_LABELS = { title: 'Title', creator: 'Creator', rights: 'Rights holder', publisher: 'Publisher', contributor: 'Contributors', date: 'Date',
  description: 'Description', subject: 'Keywords', source: 'Source', identifier: 'Identifier', relation: 'Relation', language: 'Language',
  coverage: 'Coverage', format: 'Format', type: 'Type', license: 'License' };
const metaCache = new Map();
function fileMeta(url) {
  if (!metaCache.has(url)) metaCache.set(url, fetch(url).then(r => r.arrayBuffer()).then(buffer => parseMeta(new TextDecoder().decode(buffer), buffer.byteLength)));
  return metaCache.get(url);
}
function parseMeta(text, bytes) {
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml'), root = doc.documentElement;
  const textOf = e => e.textContent.trim();
  const resource = e => e.getAttributeNS(RDF, 'resource');
  const valueOf = e => resource(e)   // a URL, else a list (rdf:Bag of rdf:li), else an agent's name (cc:Agent/dc:title), else text
    || [...e.getElementsByTagNameNS(RDF, 'li')].map(textOf).filter(Boolean).join(', ')
    || [...e.getElementsByTagNameNS(DC, 'title')].map(textOf).filter(Boolean).join(', ')
    || textOf(e);
  const label = e => RDF_LABELS[e.localName] || e.localName[0].toUpperCase() + e.localName.slice(1);
  const work = CC.flatMap(ns => [...doc.getElementsByTagNameNS(ns, 'Work')])[0];
  const terms = {};   // the cc:License block: Permits, Requires, Prohibits, one row each
  for (const lic of CC.flatMap(ns => [...doc.getElementsByTagNameNS(ns, 'License')])) {
    for (const e of lic.children) {
      const term = resource(e) ? resource(e).split('#').pop() : textOf(e);
      if (term) terms[label(e)] = terms[label(e)] ? `${terms[label(e)]}, ${term}` : term;
    }
  }
  const own = name => [...root.children].find(e => e.namespaceURI === root.namespaceURI && e.localName === name);
  return {
    bytes, text,
    spdx: (/SPDX-License-Identifier:\s*([^\r\n]*?)\s*(?:-->|$)/m.exec(text) || [])[1] || null,
    fields: work ? [...work.children].map(e => [label(e), valueOf(e)]).filter(([, value]) => value) : [],
    terms: Object.entries(terms),
    svg: { width: root.getAttribute('width'), height: root.getAttribute('height'), viewBox: root.getAttribute('viewBox') },
    inkscape: [['Inkscape version', root.getAttributeNS(INKSCAPE, 'version')], ['Document name', root.getAttributeNS(SODIPODI, 'docname')],
      ['Title (svg)', own('title') && textOf(own('title'))], ['Description (svg)', own('desc') && textOf(own('desc'))]].filter(([, value]) => value),
  };
}

  const meta = await fileMeta(url);

  return [
    el('div', { className: theme.on_dark ? 'tip-img on-dark' : 'tip-img' }, el('img', { src: url, width: 128, height: 128, alt: '' })),
    el('div', { className: 'tip-text' },

// An SVG without a viewBox draws at its own size whatever box it is given: the previews use a copy with a viewBox
// made from its width and height, a blob URL made once per file. With a viewBox the file scales as it is.

function copyText(text, button) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text);

    const ta = el('textarea', { value: text, style: 'position:fixed;opacity:0' });
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }

  const original = [...button.childNodes];
  button.replaceChildren(...buttonContent('copied', 'Copied'));
  setTimeout(() => button.replaceChildren(...original), 1000);

// --- Help > Icon Themes ---------------------------------------------------------------------------------
// The source themes as the Themes filter lists them (same order, same groups), a Blue* variant under the theme

// which sizes (the files per size in the tooltip), and where its files are: the folder on the machine running
// viewer/server.py, or two short links on the static site, the repository and the exported commit (index.json

    } else {

      for (const i of mine) for (const s of i.sizes) perSize[s.size] = (perSize[s.size] || 0) + 1;
      const sizes = Object.keys(perSize).sort((a, b) => (a === 'scalable') - (b === 'scalable') || a - b);
      const files = Object.values(perSize).reduce((a, b) => a + b, 0);
      const host = site && (t.repo.includes('gitlab') ? 'GitLab' : 'GitHub');
      parts.push(
        el('div', { className: 'name' }, t.name, ' ',
          el('small', { title: 'Icon names with a real SVG file, each counted once across its sizes: one row of the list each.\nSymlink aliases are not counted.' }, `${mine.length} icons`), ' · ',
          el('small', { title: `Icons with an SVG file in each size folder:\n${sizes.map(s => `${s}: ${perSize[s]}`).join('\n')}\n${files} SVG files in all (aliases not counted).` }, `sizes ${sizes.join(', ')}`)),
        el('div', { className: 'blurb' }, `${t.about} · ${t.license}`),
        el('div', { className: 'source' }, ...(site

    el('div', { className: 'more' }, "A theme's license applies to its files unless an SVG has an SPDX-License-Identifier comment specifying a different license. Hover a thumbnail in the detail pane (tap it on a phone) for the file card with that file's license and metadata. See also ",
      el('a', { href: docs, ...(site ? {} : { target: '_blank', rel: 'noopener' }),
                title: "Each theme's license, and warnings about mixing GPL v2, GPL v3 and CC BY-SA.\n"
                  + (site ? 'A page of this site.' : 'The README on GitHub, in a new tab.') },
        'Built-in Icon Themes and Licenses'), '.'));

$('list').addEventListener('scroll', () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(saveState, 100); });
// A right click (a long press on a phone) on a row or a cell: a popup menu to copy the icon's name, or to
// search for it, which shows the same name in every theme that has it.
$('list').addEventListener('contextmenu', e => {
  const node = e.target.closest('.row, .cell');
  if (!node) return;
  e.preventDefault();
  const icon = icons.find(i => keyOf(i) === node.dataset.key);
  openContextMenu(() => [
    { label: '_Copy Icon Name', icon: UI_ICONS.copy, run: () => { copyText(icon.name); flashStatus(`Copied ${icon.name}`); } },
    { label: '_Search Icon Name', icon: 'Tango/16x16/actions/edit-find.svg', run: () => { $('q').value = icon.name; render(); } },
  ], e.clientX, e.clientY);
});
// A short notice in the status bar, then the status text again.
let flashTimer;
function flashStatus(text) { $('status').textContent = text; clearTimeout(flashTimer); flashTimer = setTimeout(showStatus, 1500); }
$('re').addEventListener('change', render);
$('reset').addEventListener('click', () => {
  $('q').value = '';
  $('re').checked = false;
  $('q').classList.remove('invalid');
  themeSel.chooseAll();
  contextSel.chooseAll();
  sizeSel.setChosenItems(DEFAULT_SIZES.filter(s => allSizes.includes(s)));
  render();
});
$('dark').addEventListener('change', e => setDark(e.target.checked));

// --- Window frame ---------------------------------------------------------------------------------------
// Maximize drops the desktop margin around the window; the choice is kept across reloads with the rest of the
// state. A phone has no room for the margin: there the window is maximized whatever the choice, and the button
// is only drawn, as Minimize and Close are. File > Quit asks the browser to close the tab, which it only does
// for a tab that was opened straight from the URL the server printed (no other history entries); otherwise the
// status bar says so.
let maximized = !!loadState().maximized;   // the user's choice
function applyMaximized() {   // before the first paint, on a click, and when the width crosses 700 px
  document.body.classList.toggle('maximized', maximized || narrow());
  $('wm-maximize').title = document.body.classList.contains('maximized') ? 'Restore' : 'Maximize';
}
applyMaximized();
$('wm-maximize').addEventListener('click', () => { if (narrow()) return; maximized = !maximized; applyMaximized(); saveState(); });
function quit() {
  window.close();
  setTimeout(() => { $('status').textContent = 'The browser did not let the page close this tab. Close it yourself.'; }, 200);
}

// --- Menu bar -------------------------------------------------------------------------------------------
// GNOME 2 layout: File, Edit, View, Help; built and run by window.js.
const focusSearch = () => { $('q').focus(); $('q').select(); };
const copyLineButton = () => $('detail').querySelector('.included button');   // the detail pane's Copy line
const MENUS = [
  ['_File', () => [
    { label: '_Quit', icon: 'Nome/actions/16/application-exit.svg', run: quit }]],
  ['_Edit', () => [
    { label: '_Find', accel: 'Ctrl+F', icon: 'Nome/actions/16/edit-find.svg', run: focusSearch },
    { label: '_Copy Line for included_icons.txt', icon: 'Nome/actions/16/edit-copy.svg',
      disabled: !copyLineButton() || copyLineButton().disabled, run: () => copyLineButton().click() },
    null,
    { label: '_Reset Filters', icon: 'Tango/16x16/actions/edit-undo.svg', run: () => $('reset').click() }]],
  ['_View', () => [
    { label: '_List', radio: view === 'list', run: () => setView('list') },
    { label: '_Grid', radio: view === 'grid', run: () => setView('grid') },
    null,
    { label: 'Zoom _In', icon: 'Tango/16x16/actions/zoom-in.svg', disabled: view !== 'grid' || $('zoom-in').disabled, run: () => zoom(1) },
    { label: 'Zoom _Out', icon: 'Tango/16x16/actions/zoom-out.svg', disabled: view !== 'grid' || $('zoom-out').disabled, run: () => zoom(-1) },
    null,
    { label: '_Dark Background', icon: 'Tango/16x16/status/weather-clear-night.svg', check: isDark(), run: () => setDark(!isDark()) },
    { label: 'Regular _Expression Search', check: $('re').checked, run: () => $('re').click() },
    null,
    { label: '_Reload', accel: 'F5', icon: 'Nome/actions/16/view-refresh.svg', run: () => location.reload() }]],
  ['_Help', () => [
    { label: 'Icon _Themes', accel: 'F1', icon: 'Nome/apps/16/preferences-desktop-theme.svg', run: () => $('themes').showModal() },
    null,
    { label: '_About', icon: 'Nome/actions/16/help-about.svg', run: () => $('about').showModal() }]],
];
buildMenuBar(MENUS);
document.addEventListener('keydown', e => {
  if (e.ctrlKey && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); focusSearch(); }   // Edit > Find
  else if (e.key === 'F1' && !e.ctrlKey && !e.altKey && !e.shiftKey) { e.preventDefault(); $('themes').showModal(); }   // Help > Icon Themes
});
</script>
</body>
</html>
